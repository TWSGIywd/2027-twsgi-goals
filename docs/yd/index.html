<script>
// 近 30 天各區新增（每天自動更新時算出）：一朵花＝一張個人資料卡
// 女子部版是 {區: n}；青年部版是 {區: {w: 女子部, m: 男子部}}，粉紅花＝女子部、藍花＝男子部
const NEW = {"蘭陽北區": {"m": 4}, "基隆北區": {"w": 1}, "士林區": {"w": 1}, "汐止區": {"m": 1}, "北南一區": {"w": 1}, "中和區": {"w": 3}, "城林區": {"m": 1}, "桃園北區": {"m": 1}, "桃園東區": {"m": 1}, "竹縣區": {"w": 3}, "台中西區": {"w": 1}, "台中南區": {"m": 4}, "南投區": {"w": 3}, "岡山區": {"m": 1}, "高雄北區": {"m": 1}, "高雄南區": {"w": 1}};
const stage=document.getElementById("stage"), cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W,H; function rs(){const r=stage.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)} addEventListener("resize",rs); rs();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const FONT='"Huninn","PingFang TC","Microsoft JhengHei",sans-serif';
const PINKS=[["#ffd3df","#f19bb3"],["#fff3f6","#f4b6c8"],["#ffe1c9","#f0a77e"],["#fdf6d8","#e9c45a"]]; // 櫻・梅・桃・李
function flower(x,y,r,rot,pal,glow,core){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  if(glow>0){const g=ctx.createRadialGradient(0,0,0,0,0,r*3.2);g.addColorStop(0,`rgba(255,240,245,${.55*glow})`);g.addColorStop(1,"rgba(255,240,245,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*3.2,0,Math.PI*2);ctx.fill()}
  for(let k=0;k<5;k++){ctx.rotate(Math.PI*2/5);ctx.fillStyle=pal[0];ctx.beginPath();ctx.ellipse(0,r*.85,r*.52,r*.95,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=pal[1];ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,r*.25);ctx.lineTo(0,r*1.2);ctx.stroke()}
  ctx.fillStyle=core||"#f2c14e";ctx.beginPath();ctx.arc(0,0,r*.32,0,Math.PI*2);ctx.fill(); ctx.restore();
}
function label(x,y,name,n,a,lc){
  if(a<=0) return; ctx.save(); ctx.globalAlpha=a; ctx.textAlign="center"; ctx.shadowColor="rgba(40,70,110,.55)"; ctx.shadowBlur=8;
  ctx.font=`15px ${FONT}`; const w=ctx.measureText(name).width; x=Math.max(w/2+8,Math.min(W-w/2-30,x)); // 區名不要被畫面邊緣切掉
  ctx.fillStyle="#fff"; ctx.fillText(name,x,y); ctx.font=`12px ${FONT}`; ctx.fillStyle=lc||"#ffe3ea"; ctx.fillText(`+${n}`,x+w/2+12,y-1); ctx.restore();
}
let drift=[]; function spawnDrift(y){drift.push({x:Math.random()*W,y:y??-12,r:2.4+Math.random()*2.4,vy:20+Math.random()*20,sw:Math.random()*6.3,rot:Math.random()*6.3,p:PINKS[drift.length%4]})}
for(let i=0;i<20;i++) spawnDrift(Math.random()*H);
const BLUES=[["#dbe8ff","#7aa0de"],["#eaf2ff","#8fb0e6"]], BLUE_LC="#dbe8ff";
const queue=[]; // 一區一朵（青年部版：女子部、男子部各一朵），標 +N
for(const [d,v] of Object.entries(NEW)){ if(typeof v==="number") queue.push({d,n:v,b:0});
  else { if(v.w) queue.push({d,n:v.w,b:0}); if(v.m) queue.push({d,n:v.m,b:1}); } }
const palOf=(q,i)=>q.b?BLUES[i%2]:PINKS[i%4], lcOf=q=>q.b?BLUE_LC:"#ffe3ea";
const landed=[], falling=[];
const foot=document.querySelector(".foot");
function landingSpot(i){const u=(i*.618+.13)%1, v=(i*.382+.5)%1; return {x:W*(.1+u*.8), y:H*(.39+v*.15)}}
let qi=0;
const HOLD=2.6, FADE=1.6;
function drop(){ if(!queue.length) return; const q=queue[qi%queue.length], t=landingSpot(qi); qi++;
  falling.push({d:q.d,n:q.n,x:t.x+(Math.random()-.5)*60,y:H*.27,tx:t.x,ty:t.y,sw:Math.random()*6.3,rot:0,pal:palOf(q,qi),lc:lcOf(q),r:6}); }
if(!reduce){ drop(); setInterval(()=>{ if(!document.hidden && falling.length<4) drop() },2400);
  // 2026-11-21 使用者：分頁放著很久再切回來，花和區名擠成一排 → 背景時 requestAnimationFrame 停了但計時器還在丟花。
  // 改成看不到時不丟花；切回來時清掉畫面上的花、重新開始飄
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) return; falling.length=0; landed.length=0; last=performance.now(); drop(); }); }
else queue.forEach((q,i)=>{const t=landingSpot(i);landed.push({d:q.d,n:q.n,x:t.x,y:t.y,pal:palOf(q,i),lc:lcOf(q),r:6,bloom:1,lab:0,rot:0})});
let spot=-1, spotT=0, last=performance.now(), T=0;
function tick(now){const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt; ctx.clearRect(0,0,W,H);
  if(!reduce){
    if(drift.length<26 && Math.random()<.4) spawnDrift();
    drift=drift.filter(f=>f.y<H+20); for(const f of drift){f.y+=f.vy*dt;f.sw+=dt*1.4;f.rot+=dt;flower(f.x+Math.sin(f.sw)*14,f.y,f.r,f.rot,f.p,0)}
  }
  for(let i=landed.length-1;i>=0;i--){ const f=landed[i]; f.bloom=Math.min(1,f.bloom+dt*1.6); if(!reduce) f.age=(f.age||0)+dt;
    const a=Math.max(0,Math.min(1,(HOLD+FADE-(f.age||0))/FADE)); if(a<=0){ landed.splice(i,1); continue }
    ctx.save(); ctx.globalAlpha=a; flower(f.x,f.y,f.r*(.4+.6*f.bloom),f.rot+Math.sin(T*1.3+i)*.12,f.pal,.5*a); ctx.restore();
    label(f.x,f.y-16,f.d,f.n,a,f.lc); }
  for(let k=falling.length-1;k>=0;k--){ const f=falling[k]; f.sw+=dt*1.2; f.rot+=dt*.9;
    f.y+=dt*28; f.x+=(f.tx-f.x)*dt*.35; const x=f.x+Math.sin(f.sw)*12;
    flower(x,f.y,f.r,f.rot,f.pal,.6); label(x,f.y-16,f.d,f.n,1,f.lc);
    if(f.y>=f.ty){ landed.push({d:f.d,n:f.n,x,y:f.ty,pal:f.pal,lc:f.lc,r:f.r,bloom:.2,lab:2.2,rot:f.rot}); falling.splice(k,1); } }
  for(let k=sparks.length-1;k>=0;k--){ const f=sparks[k]; f.life+=dt; f.sw+=dt*1.6; f.rot+=dt*1.2;
    f.vx*=Math.exp(-2.4*dt); f.vy=Math.min(f.vy+f.g*dt,f.vmax); f.x+=f.vx*dt; f.y+=f.vy*dt;
    const a=Math.max(0,Math.min(1,f.max-f.life)); if(a<=0||f.y>H+20){sparks.splice(k,1);continue}
    ctx.save(); ctx.globalAlpha=a; flower(f.x+Math.sin(f.sw)*8,f.y,f.r,f.rot,f.pal,0,f.pal[2]); ctx.restore(); }
  requestAnimationFrame(tick)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(tick));

// ───── 我今天對話了：按一下飄藍、黃小花；同一支手機一天最多 5 次；數字是全青年部累計（不分區、不分男女） ─────
const API="https://script.google.com/macros/s/AKfycbx2GHBMekrMbVsPcgxUW53x_eFXi9a2PjM_CC-4JTldKRAzbQT9UPErV65vYX5oP1FR/exec", MAX=5;
const TALK=[["#fff1b3","#e2b02c","#fffaf0"],["#fffbea","#e9c45a","#ffd75e"],["#ffe68f","#d99d14","#fffaf0"],["#fff6d6","#e2b02c","#ffd75e"]]; // 黃・米白（藍色留給男子部的花）
const sparks=[];
function burst(){ if(reduce) return; const r=seed.getBoundingClientRect(), s=stage.getBoundingClientRect(), cx=r.left-s.left+r.width/2, cy=r.top-s.top+r.height*.35;
  for(let i=0;i<14;i++){ const a=-Math.PI/2+(Math.random()-.5)*2.4, v=170+Math.random()*230;
    sparks.push({x:cx+(Math.random()-.5)*60,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:430,vmax:46+Math.random()*24,r:3.2+Math.random()*2.8,rot:Math.random()*6.3,sw:Math.random()*6.3,pal:TALK[i%4],life:0,max:3.4+Math.random()*1.8}); } }
function rain(n){ if(reduce) return; for(let i=0;i<n;i++) setTimeout(()=>sparks.push({x:W*(.08+Math.random()*.84),y:-12,vx:0,vy:38,g:0,vmax:38+Math.random()*18,r:3+Math.random()*2.6,rot:Math.random()*6.3,sw:Math.random()*6.3,pal:TALK[i%4],life:0,max:30}),i*700+Math.random()*400); }
const dock=document.getElementById("dock"), seed=document.getElementById("seed"), toastEl=document.getElementById("toast");
const tday=document.getElementById("tday"), ttot=document.getElementById("ttot"), dots=[...document.querySelectorAll("#dots i")];
function tpeDay(){ return new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"}) }
function mem(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v) }catch(e){ return null } }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let devId=mem("talk.id"); if(!devId){ devId=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,""); mem("talk.id",devId) }
const st={day:tpeDay(),total:null,today:null,mine:0};
try{ const m=JSON.parse(mem("talk.mine")||"{}"); if(m.day===st.day) st.mine=m.n||0 }catch(e){}
let pending=0, busy=false, timer=null, tt=null;
function save(){ mem("talk.mine",JSON.stringify({day:st.day,n:st.mine})) }
function render(){ tday.textContent=st.today==null?"–":st.today.toLocaleString(); ttot.textContent=st.total==null?"–":st.total.toLocaleString();
  dots.forEach((d,i)=>d.classList.toggle("on",i<st.mine)); seed.style.setProperty("--g",(.55+.09*st.mine).toFixed(2));
  seed.classList.toggle("full",st.mine>=MAX); seed.setAttribute("aria-label",`我今天對話了（今天已按 ${st.mine} 次，最多 ${MAX} 次）`) }
function toast(t){ toastEl.textContent=t; toastEl.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove("show"),2200) }
function anim(el,c){ el.classList.remove(c); void el.offsetWidth; el.classList.add(c) }
async function call(q){ const r=await fetch(API+"?"+new URLSearchParams(q)); const j=await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j }
// 按下後的回覆隨機出現、不連續重複（使用者 2026-11-18：辛苦了、笑臉之類）
const CHEERS=["辛苦了！","辛苦了 :)","辛苦了 🙂","太好了！","太好了 :)"]; let lastCheer=-1;
function cheer(){ let i; do{ i=Math.floor(Math.random()*CHEERS.length) }while(i===lastCheer&&CHEERS.length>1); lastCheer=i; return CHEERS[i] }
function newDay(){ const d=tpeDay(); if(d!==st.day){ st.day=d; st.mine=0; if(st.today!=null) st.today=0; save() } }
seed.addEventListener("click",()=>{ newDay();
  if(st.mine>=MAX){ toast("今天已經 5 次了，明天再按"); anim(seed,"nudge"); return }
  st.mine++; pending++; if(st.today!=null) st.today++; if(st.total!=null) st.total++;
  save(); render(); anim(seed,"pop"); burst();
  toast(st.mine>=MAX?"今天 5 次，辛苦了！":cheer());
  clearTimeout(timer); timer=setTimeout(flush,700) });
async function flush(){ if(busy||!pending) return; busy=true; const n=pending; pending=0; const rid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  for(let a=0;a<4;a++){ try{ const j=await call({a:"add",d:devId,n,rid});
      if(j.day===st.day){ st.total=j.total+pending; st.today=j.today+pending; st.mine=Math.min(MAX,j.mine+pending) } save(); render();
      busy=false; if(pending) flush(); return }
    catch(e){ await sleep(1000*(a+1)+Math.random()*1500) } }
  st.mine=Math.max(0,st.mine-n); if(st.today!=null) st.today-=n; if(st.total!=null) st.total-=n; save(); render();
  toast("網路好像不太穩，這次沒有記到，請稍後再按"); busy=false }
async function poll(first){ if(busy||pending||document.hidden) return; newDay();
  try{ const j=await call({a:"get",d:devId}); if(busy||pending) return;
    const others=st.total==null?Math.min(j.today,8):Math.min(j.total-st.total,10);
    st.total=j.total; st.today=j.day===st.day?j.today:0; if(j.day===st.day) st.mine=j.mine; save(); render(); if(others>0) rain(others) }catch(e){} }
if(API){ dock.hidden=false; render(); poll(true); setInterval(poll,45000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll() }) }
</script>
</body></html>
